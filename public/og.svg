<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Classical Atlas social preview</title>
  <desc id="desc">An I Ching and Yijing systems-thinking atlas for Chinese classics.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="0.58" stop-color="#f4f1ea"/>
      <stop offset="1" stop-color="#e7e0d2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1b1b19" flood-opacity="0.16"/>
    </filter>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#1b1b19" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#grain)" opacity="0.45"/>

  <g transform="translate(92 82)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#1b1b19">Classical Atlas</text>
    <text x="2" y="58" font-family="Inter, Arial, sans-serif" font-size="28" fill="#3a5f5a">I Ching / Yijing Systems Thinking Map</text>
    <text x="2" y="114" font-family="Inter, Arial, sans-serif" font-size="24" fill="#59554c">64 hexagrams and Chinese classics as systems maps</text>

    <g transform="translate(0 178)">
      <rect x="0" y="0" width="488" height="214" rx="18" fill="#ffffff" opacity="0.62" filter="url(#shadow)"/>
      <text x="34" y="48" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#3a5f5a">TRUNK</text>
      <text x="34" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#1b1b19">Book of Changes</text>
      <text x="34" y="130" font-family="Inter, Arial, sans-serif" font-size="21" fill="#59554c">Daoism, Confucianism, Buddhism</text>
      <text x="34" y="164" font-family="Inter, Arial, sans-serif" font-size="21" fill="#59554c">Western systems comparison</text>
    </g>
  </g>

  <g transform="translate(720 74)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="480" rx="28" fill="#ffffff" opacity="0.74"/>
    <g transform="translate(58 52)" stroke="#1b1b19" stroke-width="13" stroke-linecap="round">
      <line x1="0" y1="0" x2="244" y2="0"/>
      <line x1="0" y1="46" x2="100" y2="46"/>
      <line x1="144" y1="46" x2="244" y2="46"/>
      <line x1="0" y1="92" x2="244" y2="92"/>
      <line x1="0" y1="138" x2="100" y2="138"/>
      <line x1="144" y1="138" x2="244" y2="138"/>
      <line x1="0" y1="184" x2="244" y2="184"/>
      <line x1="0" y1="230" x2="100" y2="230"/>
      <line x1="144" y1="230" x2="244" y2="230"/>
    </g>
    <g transform="translate(54 350)" fill="#3a5f5a">
      <circle cx="0" cy="0" r="8"/>
      <circle cx="42" cy="-48" r="8"/>
      <circle cx="104" cy="-18" r="8"/>
      <circle cx="172" cy="-76" r="8"/>
      <circle cx="250" cy="-30" r="8"/>
    </g>
    <g transform="translate(54 350)" stroke="#3a5f5a" stroke-width="3" opacity="0.7">
      <line x1="0" y1="0" x2="42" y2="-48"/>
      <line x1="42" y1="-48" x2="104" y2="-18"/>
      <line x1="104" y1="-18" x2="172" y2="-76"/>
      <line x1="172" y1="-76" x2="250" y2="-30"/>
    </g>
    <text x="54" y="426" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#9c3a2f">GF(2) · Cayley graph · hypercube</text>
  </g>

  <text x="94" y="560" font-family="Inter, Arial, sans-serif" font-size="20" fill="#7a756b">davirain-su.github.io/classic_system</text>
</svg>
