name: 部署到 GitHub Pages

on:
  push:
    branches: [claude/lucid-fermat-f0kES]
  workflow_dispatch:

# 允许部署 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 让 astro.config 走 GitHub Pages 子路径 base
    env:
      GITHUB_PAGES: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 官方 Astro action：自动按 lockfile 选包管理器（pnpm），安装、构建并上传 Pages 产物
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          path: .
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
